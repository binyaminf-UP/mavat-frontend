<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>מחולל תיקיות תכנית</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f2f5;min-height:100vh;
         display:flex;flex-direction:column;align-items:center;padding:40px 20px;color:#1a1a2e}
    h1{font-size:26px;margin-bottom:8px}
    .sub{color:#666;font-size:14px;margin-bottom:32px;text-align:center}
    .card{background:#fff;border-radius:16px;padding:32px;width:100%;max-width:800px;
          box-shadow:0 2px 16px rgba(0,0,0,.08);margin-bottom:24px}
    .section-title{font-size:16px;font-weight:700;margin-bottom:16px;color:#1a1a2e}

    /* Upload zone */
    .drop-zone{border:2px dashed #c0d0ff;border-radius:12px;padding:40px;
               text-align:center;cursor:pointer;transition:all .2s;background:#f8faff}
    .drop-zone:hover,.drop-zone.dragover{border-color:#4f7fff;background:#eff4ff}
    .drop-zone input{display:none}
    .drop-zone .icon{font-size:40px;margin-bottom:12px}
    .drop-zone p{color:#666;font-size:14px}
    .drop-zone .filename{color:#4f7fff;font-weight:600;margin-top:8px;font-size:15px}

    /* Buttons */
    button{padding:13px 26px;border:none;border-radius:10px;font-size:15px;
           cursor:pointer;font-weight:600;transition:all .2s}
    .btn-primary{background:#4f7fff;color:#fff;width:100%;margin-top:16px}
    .btn-primary:hover{background:#3a6be0}
    .btn-primary:disabled{background:#b0c4ff;cursor:not-allowed}
    .btn-success{background:#22c55e;color:#fff;width:100%;font-size:16px;
                 padding:15px;border-radius:12px;margin-top:12px}
    .btn-success:hover{background:#16a34a}
    .btn-success:disabled{background:#86efac;cursor:not-allowed}

    /* Status */
    .status{display:flex;align-items:center;gap:10px;padding:13px 16px;
            border-radius:10px;font-size:14px;margin-top:14px}
    .status.loading{background:#eff6ff;color:#3b82f6}
    .status.error{background:#fef2f2;color:#dc2626}
    .status.success{background:#f0fdf4;color:#16a34a}
    .spinner{width:17px;height:17px;border:3px solid #93c5fd;
             border-top-color:#3b82f6;border-radius:50%;
             animation:spin .8s linear infinite;flex-shrink:0}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* Table */
    table{width:100%;border-collapse:collapse;margin-top:4px}
    th{background:#f8faff;padding:11px 14px;text-align:right;font-size:13px;
       color:#666;border-bottom:2px solid #e8edf5;width:200px;white-space:nowrap}
    td{padding:11px 14px;border-bottom:1px solid #f0f0f0;font-size:14px}
    td[contenteditable="true"]{background:#fffbeb;outline:2px solid #fbbf24;border-radius:4px}
    .hint{font-size:12px;color:#999;margin-top:8px;text-align:left}
    .badge{background:#e8f0ff;color:#4f7fff;padding:2px 10px;border-radius:20px;
           font-size:12px;font-weight:600;margin-right:8px}
    #step2{display:none}
  </style>
</head>
<body>

<h1>🗂️ מחולל תיקיות תכנית</h1>
<p class="sub">העלה קובץ הוראות תכנית (PDF) — המערכת תחלץ את הנתונים ותיצור ZIP עם כל המסמכים</p>

<!-- Step 1 -->
<div class="card">
  <div class="section-title">שלב 1 — העלה קובץ הוראות תכנית (PDF)</div>
  <div class="drop-zone" id="drop-zone" onclick="document.getElementById('file-input').click()"
       ondragover="event.preventDefault();this.classList.add('dragover')"
       ondragleave="this.classList.remove('dragover')"
       ondrop="handleDrop(event)">
    <input type="file" id="file-input" accept=".pdf" onchange="handleFile(this.files[0])"/>
    <div class="icon">📄</div>
    <p>גרור קובץ PDF לכאן או לחץ לבחירה</p>
    <div class="filename" id="filename"></div>
  </div>
  <button class="btn-primary" id="parse-btn" onclick="parsePDF()" disabled>
    חלץ נתונים מה-PDF
  </button>
  <div id="parse-status"></div>
</div>

<!-- Step 2 -->
<div class="card" id="step2">
  <div class="section-title">
    שלב 2 — אשר את הנתונים
    <span class="badge">לחץ על שדה לעריכה</span>
  </div>
  <table><tbody id="data-tbody"></tbody></table>
  <p class="hint">💡 ניתן ללחוץ על כל שדה כדי לערוך לפני יצירת הקבצים</p>
  <button class="btn-success" id="gen-btn" onclick="generate()">✅ אשר וצור קובץ ZIP</button>
  <div id="gen-status"></div>
</div>

<script>
const BACKEND = 'https://mavat-backend.onrender.com';

const FIELDS = {
  plan_number:     'מספר תכנית',
  plan_name:       'שם תכנית',
  plan_type:       'סוג תכנית',
  area_dunam:      'שטח התכנית',
  planning_area:   'מרחב תכנון מקומי',
  local_authority: 'רשות מקומית',
  district:        'מחוז',
  has_detailed:    'מכילה הוראות תכנית מפורטת',
  union_type:      'סוג איחוד וחלוקה',
  background:      'דברי הסבר (רקע)',
  applicant:       'מגיש התכנית',
  developer:       'יזם',
  editor:          'עורך התכנית',
  surveyor:        'מודד',
  url:             'קישור למבא"ת',
};

let selectedFile = null;
let currentData = {};

function handleDrop(e) {
  e.preventDefault();
  document.getElementById('drop-zone').classList.remove('dragover');
  const f = e.dataTransfer.files[0];
  if (f) handleFile(f);
}

function handleFile(f) {
  if (!f || !f.name.toLowerCase().endsWith('.pdf')) {
    alert('יש להעלות קובץ PDF בלבד');
    return;
  }
  selectedFile = f;
  document.getElementById('filename').textContent = f.name;
  document.getElementById('parse-btn').disabled = false;
}

async function parsePDF() {
  if (!selectedFile) return;
  setStatus('parse-status', 'loading', 'מעבד את ה-PDF...');
  document.getElementById('parse-btn').disabled = true;
  document.getElementById('step2').style.display = 'none';

  const formData = new FormData();
  formData.append('file', selectedFile);

  try {
    const res = await fetch(`${BACKEND}/api/parse-pdf`, { method: 'POST', body: formData });
    const json = await res.json();
    if (!res.ok || json.error) { setStatus('parse-status','error',json.error||'שגיאה'); return; }
    currentData = json.data;
    renderTable(currentData);
    document.getElementById('step2').style.display = 'block';
    setStatus('parse-status','success','✓ הנתונים חולצו בהצלחה — בדוק ואשר למטה');
  } catch(e) {
    setStatus('parse-status','error','שגיאת תקשורת: '+e.message);
  } finally {
    document.getElementById('parse-btn').disabled = false;
  }
}

function renderTable(data) {
  const tbody = document.getElementById('data-tbody');
  tbody.innerHTML = '';
  for (const [key, label] of Object.entries(FIELDS)) {
    const tr = document.createElement('tr');
    tr.innerHTML = `<th>${label}</th>
      <td data-key="${key}" contenteditable="true">${data[key]||''}</td>`;
    tbody.appendChild(tr);
  }
}

async function generate() {
  document.querySelectorAll('#data-tbody td[data-key]').forEach(td => {
    currentData[td.dataset.key] = td.innerText.trim();
  });
  setStatus('gen-status','loading','מייצר קבצים ואורז ZIP...');
  document.getElementById('gen-btn').disabled = true;

  try {
    const res = await fetch(`${BACKEND}/api/generate`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(currentData)
    });
    if (!res.ok) { const j=await res.json(); setStatus('gen-status','error',j.error||'שגיאה'); return; }
    const blob = await res.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${currentData.plan_number||'plan'} - ${currentData.plan_name||''}.zip`;
    a.click();
    setStatus('gen-status','success','✓ הקובץ מוכן — ההורדה החלה!');
  } catch(e) {
    setStatus('gen-status','error','שגיאת תקשורת: '+e.message);
  } finally {
    document.getElementById('gen-btn').disabled = false;
  }
}

function setStatus(id, type, msg) {
  const icons = {loading:'<div class="spinner"></div>', error:'❌', success:'✅'};
  document.getElementById(id).innerHTML =
    `<div class="status ${type}">${icons[type]}<span>${msg}</span></div>`;
}
</script>
</body>
</html>
